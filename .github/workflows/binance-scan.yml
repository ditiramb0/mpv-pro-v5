name: Binance rotation scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/binance_scanner.py"
      - "scripts/binance_rotation_report.py"
      - ".github/workflows/binance-scan.yml"
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install scanner dependencies
        run: python -m pip install -r requirements.txt
      - name: Scan Binance public Spot markets
        run: python scripts/binance_rotation_report.py
